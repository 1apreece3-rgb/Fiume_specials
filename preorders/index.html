<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fiume Pre-orders</title>
<link rel="manifest" href="manifest.webmanifest?v=1">
<meta name="theme-color" content="#a4462b">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32-v3.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-v3.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pre-orders">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f2ea; --card: #fffdf9; --ink: #2b2420; --muted: #7a6d63;
    --line: #e6dccf; --accent: #a4462b; --accent-soft: #f3e1d8;
    --alert: #b3261e; --alert-soft: #fbe4e2; --warn: #8a5a00; --warn-soft: #fbf0d9;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  header { padding: 32px 0 12px; text-align: center; }
  .logo { display: block; width: 100%; max-width: 220px; height: auto; margin: 0 auto 12px; }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: clamp(34px, 7vw, 48px); line-height: 1.05; margin: 4px 0 4px;
  }
  .sub { color: var(--muted); margin: 0; font-size: 14px; }
  .install {
    margin-top: 12px; background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 9px 18px; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .install[hidden], .install-hint[hidden] { display: none; }
  .install-hint { color: var(--muted); font-size: 13px; margin: 10px auto 0; max-width: 320px; }

  .toolbar { display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 18px 0 8px; }
  .search {
    width: 100%; max-width: 420px; padding: 11px 16px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); font: inherit; color: var(--ink);
  }
  .search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .day {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin: 26px 4px 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .day .pill { letter-spacing: .06em; background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 10px; }

  .booking {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 12px; overflow: hidden;
  }
  .booking.provisional { border-style: dashed; }
  .head {
    width: 100%; display: flex; gap: 14px; align-items: center; text-align: left;
    background: none; border: 0; padding: 14px 16px; font: inherit; color: inherit; cursor: pointer;
  }
  .time {
    flex: 0 0 auto; min-width: 62px; text-align: center; padding: 6px 4px;
    background: var(--accent-soft); border-radius: 10px;
    font-weight: 600; font-size: 17px; color: var(--accent);
  }
  .time small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .who { flex: 1 1 auto; min-width: 0; }
  .who h2 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: 22px; line-height: 1.15; margin: 0;
  }
  .flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .flag { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; }
  .flag.alert { background: var(--alert-soft); color: var(--alert); }
  .flag.warn { background: var(--warn-soft); color: var(--warn); }
  .flag.muted { background: #efe8de; color: var(--muted); }
  .chev { flex: 0 0 auto; color: var(--muted); transition: transform .15s ease; font-size: 18px; }
  .booking.open .chev { transform: rotate(90deg); }

  .body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--line); }
  .booking.open .body { display: block; }
  .alerts { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--alert-soft); color: var(--alert); font-weight: 600; font-size: 14px; }
  .alerts div + div { margin-top: 2px; }
  .notes { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: #5c3d00; font-size: 14px; }
  .notes div + div { margin-top: 4px; }
  .course {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin: 18px 0 6px;
    display: flex; justify-content: space-between; gap: 10px;
  }
  .course span { color: var(--muted); letter-spacing: .04em; text-transform: none; font-weight: 500; }
  .course span.short { color: var(--warn); }
  .item { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .dish { display: flex; gap: 10px; font-weight: 600; }
  .qty { color: var(--accent); min-width: 30px; }
  .guests { margin: 3px 0 0 40px; color: var(--muted); font-size: 13.5px; }
  .guests .tag { color: var(--alert); font-weight: 600; }
  .guests.hl, .dish.hl { background: #fff3b0; }

  .empty-state, .error {
    text-align: center; color: var(--muted); padding: 50px 20px; margin-top: 20px;
    border: 1px dashed var(--line); border-radius: var(--radius);
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" src="../icons/logo-wordmark.png" alt="Fiume Italian Restaurant" width="1000" height="418">
      <h1>Pre-orders</h1>
      <p class="sub">Upcoming group bookings and what everyone has ordered.</p>
      <button class="install" id="installBtn" type="button" hidden>⬇ Install app</button>
      <p class="install-hint" id="iosHint" hidden>To install on iPhone: tap the Share button, then <b>Add to Home Screen</b>.</p>
    </header>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search name or dish" aria-label="Search pre-orders">
      <div class="chips" id="chips">
        <button class="chip on" data-f="all" type="button">All upcoming</button>
        <button class="chip" data-f="week" type="button">Next 7 days</button>
        <button class="chip" data-f="diet" type="button">Allergies &amp; dietary</button>
      </div>
    </div>

    <main id="list"><div class="empty-state">Loading pre-orders…</div></main>

    <footer id="foot">Fiume Italian Kitchen · Compton, Wolverhampton</footer>
  </div>

<script>
(function () {
  var data = { bookings: [] };
  var filter = 'all';
  var open = {};
  var listEl = document.getElementById('list');
  var searchEl = document.getElementById('search');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function todayStr(offset) {
    var d = new Date(); d.setDate(d.getDate() + (offset || 0));
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dayLabel(ds) {
    var d = new Date(ds + 'T12:00:00');
    return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  function guestHtml(g) {
    return esc(g).replace(/\[([^\]]+)\]/g, '<span class="tag">$1</span>');
  }
  function hasDiet(b) {
    if (b.alerts && b.alerts.length) return true;
    return JSON.stringify(b.courses).indexOf('[') !== -1 && /\[[A-Z]/.test(JSON.stringify(b.courses));
  }
  function matches(b, q) {
    if (!q) return true;
    var hay = [b.name, (b.alerts || []).join(' '), (b.notes || []).join(' ')];
    b.courses.forEach(function (c) { c.items.forEach(function (i) { hay.push(i.dish, i.guests.join(' ')); }); });
    return hay.join(' ').toLowerCase().indexOf(q) !== -1;
  }

  function renderBooking(b, q) {
    var isOpen = open[b.id] || !!q;
    var flags = '';
    if (b.provisional) flags += '<span class="flag warn">Provisional</span>';
    if (b.alerts && b.alerts.length) flags += '<span class="flag alert">⚠ ' + b.alerts.length + ' allerg' + (b.alerts.length > 1 ? 'ies / dietary' : 'y / dietary') + '</span>';
    if (b.notes && b.notes.length) flags += '<span class="flag muted">' + b.notes.length + ' note' + (b.notes.length > 1 ? 's' : '') + '</span>';

    var body = '';
    if (b.alerts && b.alerts.length) body += '<div class="alerts">' + b.alerts.map(function (a) { return '<div>⚠ ' + esc(a) + '</div>'; }).join('') + '</div>';
    if (b.notes && b.notes.length) body += '<div class="notes">' + b.notes.map(function (n) { return '<div>' + esc(n) + '</div>'; }).join('') + '</div>';
    b.courses.forEach(function (c) {
      var total = c.items.reduce(function (s, i) { return s + i.qty; }, 0);
      var isFood = /starter|main|dessert/i.test(c.course);
      var short = isFood && total < b.guests && !b.guestsLabel;
      body += '<div class="course">' + esc(c.course) + '<span class="' + (short ? 'short' : '') + '">' + total + ' ordered' + (short ? ' of ' + b.guests : '') + '</span></div>';
      c.items.forEach(function (i) {
        var hl = q && (i.dish.toLowerCase().indexOf(q) !== -1);
        var ghl = q && (i.guests.join(' ').toLowerCase().indexOf(q) !== -1);
        body += '<div class="item"><div class="dish' + (hl ? ' hl' : '') + '"><span class="qty">' + i.qty + '×</span><span>' + esc(i.dish) + '</span></div>' +
          (i.guests.length ? '<div class="guests' + (ghl ? ' hl' : '') + '">' + i.guests.map(guestHtml).join(', ') + '</div>' : '') + '</div>';
      });
    });

    return '<article class="booking' + (isOpen ? ' open' : '') + (b.provisional ? ' provisional' : '') + '" data-id="' + esc(b.id) + '">' +
      '<button class="head" type="button" aria-expanded="' + isOpen + '">' +
        '<div class="time">' + esc(b.time) + '<small>' + b.guests + ' ' + esc(b.guestsLabel || 'guests') + '</small></div>' +
        '<div class="who"><h2>' + esc(b.name) + '</h2>' + (flags ? '<div class="flags">' + flags + '</div>' : '') + '</div>' +
        '<span class="chev">›</span>' +
      '</button><div class="body">' + body + '</div></article>';
  }

  function render() {
    var q = searchEl.value.trim().toLowerCase();
    var today = todayStr(0), tomorrow = todayStr(1), week = todayStr(7);
    var items = data.bookings.filter(function (b) {
      if (b.date < today) return false;
      if (filter === 'week' && b.date > week) return false;
      if (filter === 'diet' && !hasDiet(b)) return false;
      return matches(b, q);
    }).sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });

    if (!items.length) {
      listEl.innerHTML = '<div class="empty-state">' + (q ? 'Nothing matches “' + esc(q) + '”.' : 'No upcoming pre-orders.') + '</div>';
      return;
    }
    var html = '', last = '';
    items.forEach(function (b) {
      if (b.date !== last) {
        var pill = b.date === today ? '<span class="pill">Today</span>' : b.date === tomorrow ? '<span class="pill">Tomorrow</span>' : '';
        html += '<div class="day">' + esc(dayLabel(b.date)) + pill + '</div>';
        last = b.date;
      }
      html += renderBooking(b, q);
    });
    listEl.innerHTML = html;
  }

  listEl.addEventListener('click', function (e) {
    var head = e.target.closest('.head');
    if (!head) return;
    var card = head.parentNode, id = card.getAttribute('data-id');
    open[id] = !card.classList.contains('open');
    card.classList.toggle('open', open[id]);
    head.setAttribute('aria-expanded', open[id]);
  });
  searchEl.addEventListener('input', render);
  document.getElementById('chips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    filter = c.getAttribute('data-f');
    document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === c); });
    render();
  });

  fetch('preorders.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      data = d && Array.isArray(d.bookings) ? d : { bookings: [] };
      if (d && d.updated) {
        var u = new Date(d.updated + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        document.getElementById('foot').textContent = 'Last updated ' + u + ' · Fiume Italian Kitchen';
      }
      render();
    })
    .catch(function () {
      listEl.innerHTML = '<div class="error">Couldn’t load the pre-orders right now. Try refreshing.</div>';
    });

  // ---------- Install as an app ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {}); });
  }
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var deferred = null, installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (!standalone) installBtn.hidden = false;
  });
  installBtn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; installBtn.hidden = true; });
  });
  window.addEventListener('appinstalled', function () { installBtn.hidden = true; });
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS && !standalone) document.getElementById('iosHint').hidden = false;
})();
</script>
</body>
</html>
